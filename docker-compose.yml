version: "3.9"

services:
  tianshang-scribe:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TIANSHANG_SCRIBE_TRANSPORT=${TIANSHANG_SCRIBE_TRANSPORT:-streamable-http}
      - TIANSHANG_SCRIBE_AUTH_TOKEN=${TIANSHANG_SCRIBE_AUTH_TOKEN:-}
      - TIANSHANG_SCRIBE_API_KEYS=${TIANSHANG_SCRIBE_API_KEYS:-}
      - TIANSHANG_SCRIBE_CORS_ORIGINS=${TIANSHANG_SCRIBE_CORS_ORIGINS:-}
      - TIANSHANG_SCRIBE_RATE_LIMIT_MAX=${TIANSHANG_SCRIBE_RATE_LIMIT_MAX:-100}
      - TIANSHANG_SCRIBE_RATE_LIMIT_WINDOW=${TIANSHANG_SCRIBE_RATE_LIMIT_WINDOW:-60}
      - TIANSHANG_SCRIBE_LOG_LEVEL=${TIANSHANG_SCRIBE_LOG_LEVEL:-INFO}
      - TIANSHANG_SCRIBE_LOG_JSON=${TIANSHANG_SCRIBE_LOG_JSON:-0}
    volumes:
      - scribe_output:/tmp/scribe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2); print(r.read().decode())"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  scribe_output: