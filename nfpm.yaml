# nfpm.yaml — TianshangScribe Debian package
name: tianshang-scribe
arch: all
platform: linux
version: ${VERSION}
version_schema: none
maintainer: TianshangScribe Contributors
description: |
  Cross-platform CLI Office document processing tool
  with LaTeX math rendering and MCP Server integration.
  Supports Word, Excel, PowerPoint create, edit, fill,
  convert, and extract operations.
license: Apache-2.0
section: utils
priority: optional
homepage: https://github.com/Tianshang301/TianshangScribe
depends:
  - python3

contents:
  - src: pyproject.toml
    dst: /usr/lib/tianshang-scribe/pyproject.toml
  - src: src/tianshang_scribe/cli/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/cli/
  - src: src/tianshang_scribe/core/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/core/
  - src: src/tianshang_scribe/rendering/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/rendering/
  - src: src/tianshang_scribe/transform/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/transform/
  - src: src/tianshang_scribe/utils/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/utils/
  - src: src/tianshang_scribe/mcp/tools/
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/tools/
  - src: src/tianshang_scribe/mcp/__init__.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/__init__.py
  - src: src/tianshang_scribe/mcp/server.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/server.py
  - src: src/tianshang_scribe/mcp/transport.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/transport.py
  - src: src/tianshang_scribe/mcp/schemas.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/schemas.py
  - src: src/tianshang_scribe/mcp/auth.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/auth.py
  - src: src/tianshang_scribe/mcp/metrics.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/metrics.py
  - src: src/tianshang_scribe/mcp/rate_limit.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/rate_limit.py
  - src: src/tianshang_scribe/mcp/security.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/security.py
  - src: src/tianshang_scribe/mcp/prompts.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/prompts.py
  - src: src/tianshang_scribe/mcp/errors.py
    dst: /usr/lib/tianshang-scribe/src/tianshang_scribe/mcp/errors.py
  - src: scripts/tianshang-scribe
    dst: /usr/bin/tianshang-scribe
    file_info:
      mode: 0755

scripts:
  postinstall: scripts/deb-postinstall.sh
