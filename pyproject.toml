[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshang-scribe"
version = "0.2.0"
description = "Cross-platform CLI Office document processing tool with LaTeX math & MCP Server"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "TianshangScribe Contributors"},
]
keywords = [
    "office", "word", "excel", "powerpoint", "docx", "xlsx", "pptx",
    "latex", "math", "omml", "mcp", "cli", "document", "report",
    "template", "pdf", "automation", "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "lxml>=4.9.0",
    "mammoth>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/Tianshang301/TianshangScribe"
Documentation = "https://github.com/Tianshang301/TianshangScribe#readme"
Repository = "https://github.com/Tianshang301/TianshangScribe.git"
Issues = "https://github.com/Tianshang301/TianshangScribe/issues"

[project.scripts]
tianshang-scribe = "src.cli.main:main_cli"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
