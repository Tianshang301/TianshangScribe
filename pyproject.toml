[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshang-scribe"
version = "0.3.0"
description = "Cross-platform CLI Office document processing tool with LaTeX math & MCP Server"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "TianshangScribe Contributors"},
]
keywords = [
    "office", "word", "excel", "powerpoint", "docx", "xlsx", "pptx",
    "latex", "math", "omml", "mcp", "cli", "document", "report",
    "template", "pdf", "automation", "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "lxml>=4.9.0",
    "mammoth>=1.6.0",
    "mcp>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "deepdiff>=7.0.0",
    "prometheus-client>=0.20.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "PyYAML>=6.0.0",
    "uvicorn>=0.30.0",
    "htmldocx>=0.0.5",
    "markdown>=3.5.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Tianshang301/TianshangScribe"
Documentation = "https://github.com/Tianshang301/TianshangScribe#readme"
Repository = "https://github.com/Tianshang301/TianshangScribe.git"
Issues = "https://github.com/Tianshang301/TianshangScribe/issues"

[project.scripts]
tianshang-scribe = "src.cli.main:main_cli"
scribe-mcp = "src.mcp.server:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
"hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0,<2.0",
    "types-PyYAML>=6.0.0",
    "types-Markdown>=3.6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W",      # errors, pyflakes, imports, naming, warnings
    "UP",                         # pyupgrade
    "B",                          # bugbear
    "SIM",                        # simplify
    "C4",                         # comprehensions
    "RUF",                        # ruff-specific
    "C90",                        # McCabe complexity
    "S",                          # bandit security
    "A",                          # builtin shadowing
    "D",                          # docstring conventions
]
ignore = [
    "E501",        # line length handled by formatter
    "C901",        # complexity gating deferred
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "N802", "N803", "N806",      # test naming conventions (snake_case helpers)
    "S101",                      # assert is idiomatic in pytest
    "S105",                      # hardcoded credentials in test fixtures
    "S602", "S603", "S607",      # subprocess invocation in tests
    "D",                         # docstrings not required in tests
]
"demo/*.py" = ["E402", "RUF001", "RUF002", "RUF003", "B905", "SIM105", "D"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
follow_imports = "silent"
ignore_missing_imports = true
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
strict_equality = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "src.cli.main",
    "src.mcp.transport",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "src.core.word_engine",
    "src.core.ppt_engine",
]
disable_error_code = ["no-untyped-call", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
filterwarnings = ["error"]
markers = [
    "stress: long-running stress/benchmark tests (deselect with '-m \"not stress\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

